# 复磐 FuPan 双模式单应用示例（不包含 Milvus）
# 默认 standalone：无登录、单用户，适合独立部署。
# 联合部署：设置 FUPAN_NO_AUTH=false，并填写下方 OIDC 变量。
# 注意：standalone 无访问控制，公网暴露即允许访客读写数据。
name: fupan

services:
  fupan:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: fupan
    ports:
      - "8080:8080"
    volumes:
      - fupan-data:/data
    environment:
      FUPAN_NO_AUTH: "${FUPAN_NO_AUTH:-true}"
      FUPAN_DATA_DIR: /data
      FUPAN_VECTOR_DISABLED: "1"
      FUPAN_OIDC_ISSUER: "${FUPAN_OIDC_ISSUER:-}"
      FUPAN_OIDC_CLIENT_ID: "${FUPAN_OIDC_CLIENT_ID:-}"
      FUPAN_OIDC_CLIENT_SECRET: "${FUPAN_OIDC_CLIENT_SECRET:-}"
      FUPAN_REDIRECT_URL: "${FUPAN_REDIRECT_URL:-}"
      FUPAN_ADMIN_SUB: "${FUPAN_ADMIN_SUB:-}"
      FUPAN_ALLOWED_SUBS: "${FUPAN_ALLOWED_SUBS:-}"
      FUPAN_ALLOWED_ENDPOINT_HOSTS: "${FUPAN_ALLOWED_ENDPOINT_HOSTS:-}"
    restart: unless-stopped

volumes:
  fupan-data:
