# 复磐 FuPan 一键部署：fupan + Milvus standalone（官方拓扑：etcd + minio + standalone）
# 用法：docker compose up -d → 浏览器打开 http://localhost:8080
name: fupan

services:
  fupan:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: fupan
    ports:
      - "8080:8080"
    volumes:
      - fupan-data:/data          # SQLite 数据目录（复习进度持久化）
    environment:
      - FUPAN_MILVUS_ADDR=milvus:19530
      - FUPAN_DATA_DIR=/data
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: fupan-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: fupan-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: fupan-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  fupan-data:
  etcd-data:
  minio-data:
  milvus-data:
